[package]
name = "pedalera"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/jimmus9/libre-pedals"
description = "Pedalera virtual de guitarra en tiempo real con interfaz gráfica y analizador"

[features]
default = []
asio = ["engine/asio"]

[dependencies]
dsp = { path = "../crates/dsp" }
engine = { path = "../crates/engine" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
