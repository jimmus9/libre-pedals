[package]
name = "engine"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/jimmus9/libre-pedals"
description = "Motor de audio WASAPI y ASIO para pedalera de guitarra en tiempo real"

[features]
default = []
asio = ["cpal/asio"]

[dependencies]
dsp = { path = "../dsp" }
cpal = "0.18"
rtrb = "0.4"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
